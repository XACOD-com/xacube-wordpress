# Publishes a GitHub Release when a version tag such as v1.2.0 is pushed.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the version numbers agree
        working-directory: xacube
        run: |
          version="${TAG#v}"
          grep -qF "define( 'XACUBE_VERSION', '$version' );" xacube.php
          grep -qE "^ \* Version: +$version\$" xacube.php
          test "$(jq -r '.releases[0].version' changelog.json)" = "$version"

      - name: Package the plugin
        run: |
          mkdir dist
          zip -r "dist/xacube-${TAG#v}.zip" xacube -x 'xacube/xacube-config.php' 'xacube/xacube-config.example.php' '*/.*'

      - name: Write the release notes
        run: jq -r '.releases[0].changes.en | map("- " + .) | join("\n")' xacube/changelog.json > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/*.zip --title "XACUBE Live Chat ${TAG#v}" --notes-file notes.md
